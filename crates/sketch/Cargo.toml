[package]
name = "solidcraft-sketch"
description = "SolidCraft sketches: points, curves, geometric constraints and dimensions, the constraint solver, and profile detection"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["text"]
# Sketch text: font loading and glyph layout (harfrust, ttf-parser, unicode-bidi). Without it
# text links still load, save and keep their curves; only new text geometry cannot be laid out.
text = ["dep:harfrust", "dep:ttf-parser", "dep:unicode-bidi"]
# Opt-in developer instrumentation; normal builds contain no collection or clocks.
solver-profiling = []

[[example]]
name = "solve_profile"
required-features = ["solver-profiling"]

[dependencies]
harfrust = { version = "0.12", optional = true }
solidcraft-geom = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
ttf-parser = { workspace = true, optional = true }
unicode-bidi = { version = "0.3", optional = true }

[dev-dependencies]
serde_json = { workspace = true }
